{% extends "layout.html" %}
{% block title %}Add Course{% endblock %}
{% block page %}Add Course{% endblock %}

{{ super() }}

{% block content %}

    <div class="row">
      <form class="col s12" method="POST" action="/courses">
        
        <div class="row">
          <div class="input-field col s6">
            <input placeholder="Course Code" name="code" type="text" class="validate">
            <label for="code">Course Code</label>
          </div>

          <div class="input-field col s6">
            <input placeholder="Course Title" name="title" type="text" class="validate">
            <label for="title">Course Title</label>
          </div>
        </div>
      
        <div class="row">
          <div class="input-field col s12">
            <button class="btn waves-effect waves-light right purple" type="submit" name="action">Add Course</button>
          </div>
        </div> 

      </form>
    </div>

    <div class="row">
      <table>
        <thead>
          <tr>
            <th>Course Code</th><th>Course Title</th>
          </tr>
        </thead>
        <tbody>
          {% for course in courses %}
            <tr>
                <td>{{course.code}}</td>
                <td>{{course.title}}</td>
            </tr>
          {% endfor %}
        <tbody>
      </table>
    </div>

{% endblock %}
